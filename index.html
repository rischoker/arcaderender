<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rischoker Arcade</title>
<style>
/* =========================================================
   RISCHOKER ARCADE — hub de juegos (estilo launcher + Aero)
   Todo es local: sin fuentes ni librerías externas (amigable con proxies)
   ========================================================= */
:root{
  --accent:#ff8a3d;
  --accent2:#ffd36b;
  --cw:min(clamp(150px,16vw,270px),27vh);
  --mid:44vh;
  --gap:clamp(16px,2vw,30px);
  --glass:rgba(255,255,255,.10);
  --glass-brd:rgba(255,255,255,.35);
  --txt:#fff;
  --font:"Segoe UI","Segoe UI Variable",Frutiger,"Helvetica Neue",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#05060d;color:var(--txt);font-family:var(--font);user-select:none;-webkit-user-select:none}

/* ---------- Fondo: arte del juego + aurora ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.bg .art{position:absolute;inset:-8%;background-size:cover;background-position:center;filter:blur(38px) saturate(1.35) brightness(.55);transform:scale(1.15);opacity:0;transition:opacity .8s ease}
.bg .art.on{opacity:1}
.bg .art.hero{filter:blur(3px) saturate(1.15) brightness(.5);transform:scale(1.04);inset:0}
/* portadas con imagen: zoom lento (Ken Burns) como vista previa + logo encima */
.cimg{position:relative;width:100%;height:100%;overflow:hidden}
.cimg .kb{width:100%;height:100%;object-fit:cover;display:block;transform-origin:60% 70%}
.playing .cimg .kb{animation:kb 7s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.18) translate(-4%,-2%)}}
.cimg .clogo{position:absolute;left:3%;top:2%;width:94%;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45));transition:transform .4s}
.playing .cimg .clogo{animation:logoPop 1.2s ease-in-out infinite alternate}
.cimg .clogo.bottom{top:auto;bottom:3%;left:8%;width:84%}
@keyframes logoPop{to{transform:scale(1.05) rotate(-1.5deg)}}
.bg .shade{position:absolute;inset:0;background:
  radial-gradient(120% 80% at 50% 0%,transparent 40%,rgba(0,0,0,.55) 100%),
  linear-gradient(180deg,rgba(0,0,0,.25) 0%,transparent 30%,rgba(0,0,0,.55) 100%)}
.aurora{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;opacity:.75}
.aurora path{transform-origin:50% 50%}
.aurora .r1{animation:wave1 14s ease-in-out infinite alternate}
.aurora .r2{animation:wave2 18s ease-in-out infinite alternate}
.aurora .r3{animation:wave1 22s ease-in-out infinite alternate-reverse}
@keyframes wave1{from{transform:translateX(-6%) skewY(-2deg)}to{transform:translateX(6%) skewY(3deg)}}
@keyframes wave2{from{transform:translateX(5%) scaleY(1)}to{transform:translateX(-5%) scaleY(1.25)}}
.bubbles span{position:absolute;bottom:-40px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.55),rgba(255,255,255,.05) 60%,transparent 70%);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh)}}

/* ---------- Barra superior ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:clamp(12px,2.2vh,24px) clamp(16px,3vw,44px)}
.pill{display:flex;align-items:center;gap:12px;padding:6px 18px 6px 6px;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.06) 50%,rgba(255,255,255,.02) 51%,rgba(255,255,255,.10));border:1px solid var(--glass-brd);box-shadow:0 0 0 1px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.6),0 8px 24px rgba(0,0,0,.35);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.orb{width:clamp(34px,4vh,46px);aspect-ratio:1;border-radius:50%;position:relative;background:radial-gradient(circle at 50% 120%,var(--accent2),var(--accent) 45%,#1a1030 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.5),0 0 18px var(--accent);transition:background .6s,box-shadow .6s}
.orb::before{content:"";position:absolute;left:12%;right:12%;top:6%;height:45%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.05))}
.orb svg{position:absolute;inset:22%;width:56%;height:56%}
.pill small{display:block;font-size:clamp(9px,1.1vh,12px);letter-spacing:.14em;opacity:.75;text-transform:uppercase}
.pill b{font-size:clamp(15px,2.2vh,22px);font-weight:600}
.status{display:flex;align-items:center;gap:clamp(14px,2vw,28px);font-size:clamp(15px,2.4vh,24px);text-shadow:0 2px 8px rgba(0,0,0,.6)}
.status .count{display:flex;align-items:center;gap:8px;opacity:.9}
.status .count i{width:10px;height:10px;border-radius:50%;background:#5dff8a;box-shadow:0 0 10px #5dff8a}

/* ---------- Carrusel ---------- */
.shelf{position:fixed;left:0;right:0;top:calc(var(--mid) - var(--cw)*.667 - 20px);z-index:3;height:calc(var(--cw)*1.33 + 40px)}
.track{position:absolute;left:0;top:20px;display:flex;gap:var(--gap);transition:transform .45s cubic-bezier(.2,.8,.2,1);will-change:transform}
.card{position:relative;flex:none;width:var(--cw);aspect-ratio:3/4;border-radius:18px;cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1),filter .35s;filter:brightness(.78) saturate(.9);outline:none}
.card .art{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:#111;box-shadow:0 14px 34px rgba(0,0,0,.55);-webkit-box-reflect:below 12px linear-gradient(transparent 72%,rgba(255,255,255,.22))}
.card .art svg{width:100%;height:100%;display:block}
.card .snap{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.card.playing .snap.ready{opacity:1}
.card .gloss{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(165deg,rgba(255,255,255,.42) 0%,rgba(255,255,255,.10) 38%,rgba(255,255,255,0) 39%,rgba(255,255,255,0) 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.45),inset 0 -30px 40px -30px rgba(0,0,0,.6)}
.card .ring{position:absolute;inset:-7px;border-radius:24px;pointer-events:none;opacity:0;transition:opacity .3s}
.card .badge{position:absolute;left:10px;bottom:10px;font-size:11px;font-weight:700;letter-spacing:.08em;padding:4px 9px;border-radius:999px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.35);opacity:0;transform:translateY(6px);transition:.3s;display:flex;gap:6px;align-items:center}
.card .badge i{width:7px;height:7px;border-radius:50%;background:#ff4757;box-shadow:0 0 8px #ff4757;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.card.playing .badge{opacity:1;transform:none}
.card:hover{filter:brightness(.95)}
.card.sel{transform:scale(1.12);filter:none;z-index:2}
.card.sel .ring{opacity:1;box-shadow:0 0 0 3px #fff,0 0 0 6px var(--accent),0 0 38px 6px var(--accent);animation:ring 2.2s ease-in-out infinite}
@keyframes ring{50%{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--accent2),0 0 52px 12px var(--accent)}}

/* ---------- Detalle del juego ---------- */
.info{position:fixed;z-index:4;left:clamp(16px,6vw,90px);right:clamp(16px,6vw,90px);top:calc(var(--mid) + var(--cw)*.667 + 36px)}
.info h1{font-size:clamp(28px,5.4vh,58px);font-weight:600;letter-spacing:-.01em;text-shadow:0 3px 16px rgba(0,0,0,.7);line-height:1.05}
.info p{margin-top:8px;max-width:900px;font-size:clamp(14px,2vh,19px);opacity:.88;text-shadow:0 2px 8px rgba(0,0,0,.8);line-height:1.4}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tag{font-size:clamp(11px,1.5vh,14px);padding:5px 12px;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,.06) 55%,rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.info .fade{transition:opacity .25s,transform .25s}
.info.swap .fade{opacity:0;transform:translateY(8px)}

/* ---------- Dock inferior (vidrio Aero) ---------- */
.dock{position:fixed;z-index:6;left:50%;bottom:clamp(34px,5.5vh,60px);transform:translateX(-50%);display:flex;align-items:center;gap:clamp(8px,1.2vw,16px);padding:10px 18px;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.08) 48%,rgba(255,255,255,.02) 50%,rgba(255,255,255,.12) 100%);
  border:1px solid rgba(255,255,255,.45);box-shadow:0 0 0 1px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.75),0 18px 40px rgba(0,0,0,.5);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4)}
.dock .sep{width:1px;height:34px;background:linear-gradient(transparent,rgba(255,255,255,.5),transparent)}
.btn{position:relative;width:clamp(42px,5.6vh,56px);aspect-ratio:1;border-radius:50%;border:none;cursor:pointer;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 50% 115%,var(--c2,#7fd3ff) 0%,var(--c1,#1b6fd1) 55%,#0a1c3f 100%);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55),inset 0 -6px 12px rgba(0,0,0,.35),0 4px 12px rgba(0,0,0,.45);transition:transform .15s,box-shadow .2s}
.btn::before{content:"";position:absolute;left:14%;right:14%;top:5%;height:46%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.08));pointer-events:none}
.btn svg{width:46%;height:46%;position:relative;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.btn:hover{transform:translateY(-3px) scale(1.06);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7),0 0 22px var(--c2,#7fd3ff),0 6px 14px rgba(0,0,0,.45)}
.btn:active{transform:scale(.95)}
.btn.play{width:clamp(56px,7.4vh,74px);--c1:#2fa52f;--c2:#b6ff5c}
.btn.off{filter:grayscale(1) brightness(.75)}
.btn .tip{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(4px);white-space:nowrap;font-size:12px;padding:4px 10px;border-radius:8px;background:rgba(10,14,30,.85);border:1px solid rgba(255,255,255,.3);opacity:0;pointer-events:none;transition:.2s}
.btn:hover .tip{opacity:1;transform:translateX(-50%)}

/* ---------- Ayudas de teclado ---------- */
.hints{position:fixed;z-index:6;left:clamp(16px,3vw,44px);bottom:clamp(10px,2vh,20px);display:flex;gap:18px;font-size:clamp(11px,1.5vh,14px);opacity:.85;flex-wrap:wrap}
.hints span{display:flex;align-items:center;gap:7px}
.hints kbd{font-family:var(--font);font-size:.85em;min-width:24px;height:24px;padding:0 6px;display:grid;place-items:center;border-radius:50%;border:1.5px solid rgba(255,255,255,.8);background:rgba(255,255,255,.08)}
.hints kbd.wide{border-radius:7px}

/* ---------- Transición al lanzar ---------- */
.launch{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle,rgba(0,0,0,.4),#000 75%);opacity:0;pointer-events:none;transition:opacity .45s}
.launch.on{opacity:1;pointer-events:auto}
.launch .box{text-align:center;transform:scale(.9);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.launch.on .box{transform:none}
.launch .mini{width:min(220px,40vw);aspect-ratio:3/4;margin:0 auto 22px;border-radius:18px;overflow:hidden;box-shadow:0 0 60px var(--accent)}
.launch .mini svg{width:100%;height:100%;display:block}
.launch h2{font-weight:600;font-size:clamp(20px,3.4vh,34px)}
.spinner{margin:18px auto 0;width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Animaciones de las portadas (preview sin video) ---------- */
.cover *{transform-box:fill-box}
.playing .bob{animation:bob .38s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes bob{to{transform:translateY(-3px) rotate(-4deg)}}
.playing .sunrays{animation:spin 18s linear infinite;transform-origin:center}
.playing .march{animation:march 2.4s ease-in-out infinite alternate}
@keyframes march{to{transform:translateX(-14px)}}
.playing .wheel{animation:spin 6s linear infinite;transform-origin:center}
.playing .fly{animation:fly 2.2s linear infinite}
.playing .fly.b{animation-delay:-1.1s}
@keyframes fly{from{transform:translateX(-200px)}to{transform:translateX(220px)}}
.playing .note{animation:note 1.6s ease-in-out infinite}
@keyframes note{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
.playing .drive{animation:drive 1.8s ease-in-out infinite alternate}
.playing .drive.b{animation-duration:2.3s}
@keyframes drive{to{transform:translate(12px,-6px)}}
.flash{opacity:0}
.playing .flash{animation:flash 1.2s steps(1) infinite;transform-origin:center}
@keyframes flash{0%{opacity:1;transform:scale(1)}20%{opacity:.6;transform:scale(1.3)}40%{opacity:0}}
.playing .shell{animation:shell 1.2s linear infinite}
@keyframes shell{from{transform:translate(0,0)}to{transform:translate(70px,-35px)}}
.playing .grain{animation:grain .25s steps(2) infinite}
@keyframes grain{50%{transform:translate(-6px,4px)}}
.playing .twinkle{animation:blink 1.4s infinite}
.playing .qmark{animation:bob 1s ease-in-out infinite alternate}

/* ---------- Brillo al pasar de juego ---------- */
.card .shine{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.card .shine::after{content:"";position:absolute;top:-20%;bottom:-20%;width:45%;left:-70%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-18deg)}
.card.sweep .shine::after{animation:sweep .45s ease-out}
@keyframes sweep{to{left:140%}}
.card.chosen{transform:scale(1.28)!important;z-index:5;filter:brightness(1.2)!important}

/* ---------- Pantalla de inicio "PRESIONA START" ---------- */
.intro{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;cursor:pointer;
  background:radial-gradient(ellipse at center,rgba(10,24,70,.55),rgba(0,0,0,.94) 75%);transition:opacity .5s,transform .5s}
.intro.out{opacity:0;transform:scale(1.15);pointer-events:none}
.logo{position:relative;text-align:center;padding:4vh 6vw}
.logo h1{font-family:"Arial Black",Impact,sans-serif;font-style:italic;font-size:clamp(44px,11vw,150px);letter-spacing:-.02em;line-height:.95;padding:0 .15em;
  background:linear-gradient(180deg,#fff 0%,#d6e8ff 44%,#2f63cf 50%,#7fc4ff 72%,#fff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 5px 0 #0a1840) drop-shadow(0 0 24px rgba(80,170,255,.7));transform:skewX(-8deg)}
.logo h2{font-size:clamp(18px,3.4vw,44px);letter-spacing:.6em;padding-left:.6em;font-weight:300;margin-top:1vh;color:#cdeeff;text-shadow:0 0 14px #39e6ff}
.logo .ring{position:absolute;left:50%;top:50%;border-radius:50%;translate:-50% -50%;pointer-events:none;border:2px solid;border-color:rgba(255,255,255,.2) rgba(57,230,255,.75)}
.logo .r1{width:min(82vw,920px);height:min(24vw,250px);animation:spin3 8s linear infinite}
.logo .r2{width:min(62vw,720px);height:min(32vw,330px);animation:spin3 12s linear infinite reverse;border-style:dashed;border-color:rgba(255,225,77,.45)}
@keyframes spin3{to{rotate:360deg}}
.press{font-family:"Arial Black",Impact,sans-serif;font-size:clamp(18px,3.2vh,34px);letter-spacing:.3em;color:#ffe14d;text-shadow:0 0 14px #ff8a00;animation:blink 1.1s steps(1) infinite}
.intro small{opacity:.65;letter-spacing:.12em;font-size:clamp(11px,1.6vh,15px)}

/* ---------- Efectos de selección: flechas, flash, "¡A JUGAR!" ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:24;pointer-events:none;opacity:0}
#fx.on{opacity:1}
#flashW{position:fixed;inset:0;background:#fff;z-index:26;opacity:0;pointer-events:none}
.slam{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0}
.slam.on{opacity:1}
.slam span{font-family:"Arial Black",Impact,sans-serif;font-style:italic;font-size:clamp(50px,12vw,170px);color:#fff;-webkit-text-stroke:5px #000;paint-order:stroke fill;text-shadow:0 0 0 #000,8px 8px 0 #000,0 0 40px var(--accent);transform:skewX(-10deg) scale(3);opacity:0}
.slam.on span{animation:slamIn .35s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes slamIn{to{transform:skewX(-10deg) scale(1);opacity:1}}
.slam b{margin-top:1.5vh;font-size:clamp(18px,3.5vh,38px);letter-spacing:.3em;text-transform:uppercase;background:linear-gradient(90deg,transparent,var(--accent) 15%,var(--accent) 85%,transparent);padding:8px 70px;transform:skewX(-10deg) translateX(-130vw);text-shadow:0 2px 0 rgba(0,0,0,.4)}
.slam.on b{animation:barIn .4s .12s ease-out forwards}
@keyframes barIn{to{transform:skewX(-10deg) translateX(0)}}

/* ---------- Modo ligero (PCs lentos) ---------- */
body.lite .bg .art{filter:blur(22px) brightness(.5);transform:scale(1.1)}
body.lite .aurora,body.lite .bubbles{display:none}
body.lite .pill,body.lite .dock,body.lite .tag{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(20,26,48,.85)}
body.lite .card .art{-webkit-box-reflect:unset}
body.lite .card.sel .ring{animation:none}

@media (max-width:640px){
  .hints,.status .count,#bPrev,#bNext,.dock .sep{display:none}
  .pill small{display:none}
  .dock{bottom:14px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;transition-duration:0s!important}}
</style>
</head>
<body>

<div class="bg">
  <div class="art" id="bgA"></div>
  <div class="art" id="bgB"></div>
  <svg class="aurora" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="au1" x1="0" x2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity="0"/><stop offset=".5" stop-color="#7fe3ff" stop-opacity=".55"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient>
      <linearGradient id="au2" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
    </defs>
    <path class="r1" filter="url(#soft)" fill="url(#au1)" d="M-100,640 C250,520 520,760 860,620 C1150,500 1350,640 1700,560 L1700,620 C1350,700 1150,570 860,690 C520,830 250,600 -100,710Z"/>
    <path class="r2" filter="url(#soft)" fill="url(#au2)" d="M-100,700 C300,600 600,800 900,690 C1200,580 1400,720 1700,650 L1700,672 C1400,742 1200,606 900,716 C600,826 300,628 -100,724Z"/>
    <path class="r3" filter="url(#soft)" fill="url(#au1)" d="M-100,300 C300,220 700,380 1000,280 C1250,200 1450,300 1700,240 L1700,262 C1450,330 1250,232 1000,312 C700,412 300,250 -100,330Z" opacity=".5"/>
  </svg>
  <div class="bubbles" id="bubbles"></div>
  <div class="shade"></div>
</div>

<header class="top">
  <div class="pill">
    <div class="orb"><svg viewBox="0 0 24 24" fill="#fff"><path d="M7 9h2V7h2v2h2v2h-2v2H9v-2H7zM15.5 9a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zM18 12.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z" opacity=".95"/></svg></div>
    <div><small id="hubSub">Selecciona un juego</small><b id="hubName">Rischoker Arcade</b></div>
  </div>
  <div class="status">
    <span class="count"><i></i><span id="count"></span></span>
    <span id="clock">--:--</span>
  </div>
</header>

<section class="shelf"><div class="track" id="track"></div></section>

<section class="info" id="info">
  <h1 class="fade" id="title"></h1>
  <div class="tags fade" id="tags"></div>
  <p class="fade" id="desc"></p>
</section>

<nav class="dock">
  <button class="btn" id="bHome" style="--c1:#3a4b6e;--c2:#c8d6ff"><span class="tip">Inicio</span><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg></button>
  <button class="btn" id="bPrev" style="--c1:#1b6fd1;--c2:#7fd3ff"><span class="tip">Anterior</span><svg viewBox="0 0 24 24" fill="#fff"><path d="M15.5 4 7 12l8.5 8 1.5-1.6L10.2 12 17 5.6z"/></svg></button>
  <button class="btn play" id="bPlay"><span class="tip">¡Jugar!</span><svg viewBox="0 0 24 24" fill="#fff"><path d="M7 4v16l14-8z"/></svg></button>
  <button class="btn" id="bNext" style="--c1:#1b6fd1;--c2:#7fd3ff"><span class="tip">Siguiente</span><svg viewBox="0 0 24 24" fill="#fff"><path d="M8.5 4 17 12l-8.5 8L7 18.4l6.8-6.4L7 5.6z"/></svg></button>
  <span class="sep"></span>

/* --- selección --- */
function select(i,recenter=true){
  i=Math.max(0,Math.min(GAMES.length-1,i));
  const changed=i!==sel;
  cards.forEach(c=>{c.classList.remove("sel");stopPreview(c)});
  sel=i; const c=cards[i], g=GAMES[i];
  c.classList.add("sel");
  if(changed){ sfxMove(); c.classList.remove("sweep"); void c.offsetWidth; c.classList.add("sweep"); }
  ensureVisible(i);
  document.documentElement.style.setProperty("--accent",g.accent);
  document.documentElement.style.setProperty("--accent2",g.accent2||g.accent);
  // fondo con crossfade
  const a=$("#bgA"), b=$("#bgB"), on=bgFlip?a:b, off=bgFlip?b:a; bgFlip=!bgFlip;
  on.style.backgroundImage=`url("${bgURL(g)}")`; on.classList.toggle("hero",!!g.hero); on.classList.add("on"); off.classList.remove("on");
  // texto
  info.classList.add("swap");
  setTimeout(()=>{
    $("#title").textContent=g.name;
    $("#desc").textContent=g.desc||"";
    $("#tags").innerHTML=(g.tags||[]).map(t=>`<span class="tag">${t}</span>`).join("");
    info.classList.remove("swap");
  },changed?180:0);
  $("#bPlay").classList.toggle("off",!g.url);
  clearTimeout(previewTimer);
  previewTimer=setTimeout(()=>startPreview(c,g),450);
}

function ensureVisible(i){
  const c=cards[i], vw=innerWidth, pad=Math.max(16,vw*.06);
  const left=c.offsetLeft+offset, right=left+c.offsetWidth;
  if(left<pad) offset+=pad-left;
  else if(right>vw-pad) offset-=right-(vw-pad);
  offset=Math.min(pad,offset);
  track.style.transform=`translateX(${offset}px)`;
}

function startPreview(c,g){

    v.oncanplay=()=>v.classList.add("ready");

  c.classList.remove("playing");

}

/* =========================================================
   AUDIO (WebAudio, todo sintetizado: sin archivos externos)
   ========================================================= */
let actx=null, master, sfxBus, musBus, noiseBuf;
const MUS_VOL=.6;
function ac(){
  if(!actx){ try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain(); master.gain.value=.9; master.connect(actx.destination);
    sfxBus=actx.createGain(); sfxBus.gain.value=soundOn?1:0; sfxBus.connect(master);
    musBus=actx.createGain(); musBus.gain.value=musicOn?MUS_VOL:0; musBus.connect(master);
    noiseBuf=actx.createBuffer(1,actx.sampleRate,actx.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }catch(e){ actx=null; } }
  if(actx&&actx.state==="suspended") actx.resume();
  return actx;
}
function env(g,t,a,peak,dec){ g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+dec); }
function osc(type,f,t,dur,peak,dest,a=.004){
  const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
  env(g,t,a,peak,dur); o.connect(g).connect(dest); o.start(t); o.stop(t+a+dur+.05); return o;
}
function noise(t,dur,peak,dest,type="highpass",f=6000,q=.7){
  const s=actx.createBufferSource(); s.buffer=noiseBuf;
  const fl=actx.createBiquadFilter(); fl.type=type; fl.frequency.setValueAtTime(f,t); fl.Q.value=q;
  const g=actx.createGain(); env(g,t,.002,peak,dur);
  s.connect(fl).connect(g).connect(dest); s.start(t,Math.random()*.5); s.stop(t+dur+.05); return fl;
}

/* ---- efectos ---- */
function sfxMove(){ if(!ac()) return; const t=actx.currentTime;
  const o=osc("square",700,t,.07,.045,sfxBus); o.frequency.exponentialRampToValueAtTime(2400,t+.06);
  const o2=osc("sine",1600,t+.035,.1,.06,sfxBus); o2.frequency.exponentialRampToValueAtTime(3400,t+.1);
  noise(t,.03,.07,sfxBus,"highpass",8000);
}
function sfxConfirm(){ if(!ac()) return; const t=actx.currentTime;
  const o=osc("sawtooth",180,t,.32,.07,sfxBus); o.frequency.exponentialRampToValueAtTime(2200,t+.3);
  [523,659,784,1047].forEach(f=>osc("square",f,t+.06,.45,.035,sfxBus));
  const fl=noise(t,.5,.22,sfxBus,"bandpass",500,2); fl.frequency.exponentialRampToValueAtTime(6000,t+.45);
}
function sfxWhoosh(){ if(!ac()) return; const t=actx.currentTime;
  const fl=noise(t,.45,.25,sfxBus,"bandpass",300,1.5); fl.frequency.exponentialRampToValueAtTime(5000,t+.4);
}
function sfxSlam(){ if(!ac()) return; const t=actx.currentTime;
  const k=osc("sine",170,t,.4,.7,sfxBus); k.frequency.exponentialRampToValueAtTime(38,t+.35);
  noise(t,.35,.3,sfxBus,"lowpass",1400);
  [220,330,440].forEach(f=>osc("sawtooth",f,t,.25,.04,sfxBus));
}
function sfxStart(){ if(!ac()) return; const t=actx.currentTime;
  [440,554,659,880,1109,1319,1760].forEach((f,i)=>osc("square",f,t+i*.045,.12,.045,sfxBus));
  const fl=noise(t,.7,.2,sfxBus,"bandpass",4000,1.2); fl.frequency.exponentialRampToValueAtTime(300,t+.65);
}

/* ---- música: loop techno "robot" original, estilo 2000 ---- */
const BPM=132, STEP=60/BPM/4;
const mtof=m=>440*Math.pow(2,(m-69)/12);
const CHORDS=[[45,[57,60,64]],[41,[53,57,60]],[43,[55,59,62]],[40,[52,55,59]]]; // Am F G Em
const _=-1, LEAD=[
  69,_,72,_,76,74,72,_, 69,_,72,74,_,72,69,_,
  65,_,69,_,72,71,69,_, 65,_,69,72,_,74,72,_,
  67,_,71,_,74,72,71,_, 67,_,71,74,_,76,74,_,
  76,_,74,_,72,71,72,_, 71,_,67,_,64,_,_,_ ];
let seqTimer=null, nextT=0, step=0;

function kick(t){ const o=osc("sine",150,t,.24,.85,musBus); o.frequency.exponentialRampToValueAtTime(42,t+.13); }
function snare(t){ noise(t,.16,.32,musBus,"bandpass",1900,.8); osc("triangle",210,t,.08,.12,musBus); }
function hat(t,v){ noise(t,.03,v,musBus,"highpass",9000); }
function bass(f,t){
  const o=actx.createOscillator(), fl=actx.createBiquadFilter(), g=actx.createGain();
  o.type="sawtooth"; o.frequency.value=f; fl.type="lowpass"; fl.Q.value=8;
  fl.frequency.setValueAtTime(1400,t); fl.frequency.exponentialRampToValueAtTime(180,t+.16);
  env(g,t,.004,.2,.18); o.connect(fl).connect(g).connect(musBus); o.start(t); o.stop(t+.25);
}
function arp(f,t){ osc("triangle",f,t,.09,.05,musBus); }
function robot(f,t,dbl){
  // voz "robot": onda cuadrada con modulación en anillo y filtro que "habla"
  const car=actx.createOscillator(), mod=actx.createOscillator(), rm=actx.createGain(), dry=actx.createGain(),
        fl=actx.createBiquadFilter(), g=actx.createGain(), len=STEP*1.7;
  car.type="square"; car.frequency.setValueAtTime(f*.94,t); car.frequency.exponentialRampToValueAtTime(f,t+.03);
  mod.type="sine"; mod.frequency.value=f*1.5; rm.gain.value=0; mod.connect(rm.gain);
  dry.gain.value=.6; car.connect(rm); car.connect(dry);
  fl.type="bandpass"; fl.Q.value=4; fl.frequency.setValueAtTime(700,t); fl.frequency.exponentialRampToValueAtTime(2600,t+len*.6);
  rm.connect(fl); dry.connect(fl); env(g,t,.006,dbl?.16:.12,len); fl.connect(g).connect(musBus);
  car.start(t); mod.start(t); car.stop(t+len+.05); mod.stop(t+len+.05);
  if(dbl) osc("square",f*2,t,len*.6,.025,musBus);
}
function stab(fs,t){
  fs.forEach(f=>{ [-7,7].forEach(dt=>{
    const o=actx.createOscillator(), fl=actx.createBiquadFilter(), g=actx.createGain();
    o.type="sawtooth"; o.frequency.value=f*2; o.detune.value=dt; fl.type="bandpass"; fl.Q.value=3;
    fl.frequency.setValueAtTime(600,t); fl.frequency.exponentialRampToValueAtTime(3200,t+.3);
    env(g,t,.01,.025,.5); o.connect(fl).connect(g).connect(musBus); o.start(t); o.stop(t+.6); }); });
}
function schedStep(s,t){
  const bar=Math.floor(s/16)%4, st=s%16, [root,ch]=CHORDS[bar];
  const cyc = s<64 ? 0 : 1+((Math.floor(s/64)-1)%3);   // 0 = intro, luego 1-3 en loop
  if(st%4===0) kick(t);
  if(cyc>0 && (st===4||st===12)) snare(t);
  if(st%2===1) hat(t,.06); else if(cyc>0) hat(t,.02);
  if(st%2===0) bass(mtof(root+(st%4===2?12:0)),t);
  if(cyc>0) arp(mtof(ch[st%3]+12),t);
  if(st===0 && cyc>=1) stab(ch.map(mtof),t);
  if(cyc>=2){ const n=LEAD[bar*16+st]; if(n>0) robot(mtof(n),t,cyc===3); }
}
function musicTick(){ while(nextT<actx.currentTime+.12){ schedStep(step,nextT); nextT+=STEP; step++; } }
let bgm=null;
function startMusic(){
  if(!ac()) return;
  if(HUB.music){                                   // canción en mp3, en bucle
    if(!bgm){ bgm=new Audio(asset(HUB.music)); bgm.loop=true; bgm.preload="auto";
      try{ actx.createMediaElementSource(bgm).connect(musBus); }catch(e){} }
    musBus.gain.setValueAtTime(0,actx.currentTime); musLevelUp(1.2);   // entra con fade-in
    bgm.play().catch(()=>{}); return;
  }
  if(seqTimer) return; nextT=actx.currentTime+.06; step=0; seqTimer=setInterval(musicTick,25);
}
function musLevelUp(tc=.3){ musicLevel(MUS_VOL,tc/3); }
function musicLevel(v,tc=.15){ if(musBus) musBus.gain.setTargetAtTime(v,actx.currentTime,tc); }
function toggleMusic(){ musicOn=!musicOn; $("#bMusic").classList.toggle("off",!musicOn); musicLevel(musicOn?MUS_VOL:0);
  if(bgm&&!musicOn) setTimeout(()=>{ if(!musicOn) bgm.pause(); },400);
  if(musicOn&&started) startMusic(); }
function toggleSound(){ soundOn=!soundOn; $("#bSound").classList.toggle("off",!soundOn); if(sfxBus) sfxBus.gain.value=soundOn?1:0; if(soundOn) sfxMove(); }

/* =========================================================
   EFECTOS VISUALES: flechas locas + flash blanco
   ========================================================= */
const fx=$("#fx"), fctx=fx.getContext("2d"), flashEl=$("#flashW"), slam=$("#slam");
function sizeFx(){ const d=Math.min(devicePixelRatio||1,2); fx.width=innerWidth*d; fx.height=innerHeight*d; fctx.setTransform(d,0,0,d,0,0); }
sizeFx();
// Nota: los flashes están separados >0,5 s (menos de 3 por segundo) para cuidar a estudiantes fotosensibles.
function flash(ms=280,peak=1){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) peak=Math.min(peak,.25);
  flashEl.style.transition="none"; flashEl.style.opacity=peak; void flashEl.offsetWidth;
  flashEl.style.transition=`opacity ${ms}ms ease-out`; flashEl.style.opacity=0;
}
/* ---- flechas gigantes estilo selección arcade + fondo de cuadrícula ---- */
let arrows=[], fxRun=false, fxT0=0, shake=0;
const isLite=()=>document.body.classList.contains("lite");
const now=()=>performance.now()/1000;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const gridCv=document.createElement("canvas");

function rr(c,x,y,w,h,r){ r=Math.min(r,w/2,h/2); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); c.fill(); }
function buildGrid(){
  const W=innerWidth, H=innerHeight; if(gridCv.width===W&&gridCv.height===H) return;
  gridCv.width=W; gridCv.height=H; const c=gridCv.getContext("2d");
  c.fillStyle="#000"; c.fillRect(0,0,W,H);
  if(!isLite()) c.filter="blur(3px)";
  c.fillStyle="#fff";
  const cell=Math.max(46,W/15), gap=cell*.3, r=cell*.2, wall=W*.13, sc=.4;
  for(let y=-cell*.35;y<H;y+=cell){
    for(let x=wall+gap/2;x<W-wall-cell*.5;x+=cell) rr(c,x,y,cell-gap,cell-gap,r);          // pared del fondo
    let x=wall-gap*sc;                                                                       // pared izquierda
    for(let k=0;x>-cell;k++){ const w=(cell-gap)*sc*Math.pow(1.12,k); x-=w; rr(c,x,y,w,cell-gap,r*sc); x-=gap*sc; }
    x=W-wall+gap*sc;                                                                         // pared derecha
    for(let k=0;x<W+cell;k++){ const w=(cell-gap)*sc*Math.pow(1.12,k); rr(c,x,y,w,cell-gap,r*sc); x+=w+gap*sc; }
  }
  c.filter="none";
  c.fillStyle="rgba(0,0,0,.25)"; for(let y=0;y<H;y+=4) c.fillRect(0,y,W,2);                // líneas de TV
}

function arrowPath(c,w,len){
  const h=w/2, L=w*1.9, Hh=w*1.15;
  c.beginPath(); c.moveTo(0,0);
  c.lineTo(-L,-Hh); c.lineTo(-L+w*.3,-Hh*.74); c.lineTo(-L-w*.14,-Hh*.6); c.lineTo(-L+w*.2,-h);   // muesca en zigzag
  c.lineTo(-len,-h); c.lineTo(-len,h);
  c.lineTo(-L+w*.2,h); c.lineTo(-L-w*.14,Hh*.6); c.lineTo(-L+w*.3,Hh*.74); c.lineTo(-L,Hh);
  c.closePath();
}
function drawArrow(c,a,x,y){
  const w=a.w, L=w*1.9, Hh=w*1.15, len=a.len;
  c.save(); c.translate(x,y); c.rotate(a.ang); c.lineJoin="miter"; c.miterLimit=6;
  arrowPath(c,w,len);
  c.strokeStyle="#000"; c.lineWidth=w*.44; c.stroke();        // borde exterior negro
  c.strokeStyle="#fff"; c.lineWidth=w*.24; c.stroke();        // borde blanco grueso
  c.fillStyle="#000"; c.fill();                               // cuerpo negro
  c.strokeStyle="#fff"; c.lineWidth=Math.max(1.5,w*.04);      // trazado interior doble
  c.beginPath();
  c.moveTo(-L+w*.35,-w*.3); c.lineTo(-len,-w*.3); c.moveTo(-L+w*.35,w*.3); c.lineTo(-len,w*.3);
  c.moveTo(-w*.55,0); c.lineTo(-L*.8,-Hh*.64); c.moveTo(-w*.55,0); c.lineTo(-L*.8,Hh*.64);
  c.stroke(); c.restore();
}
// lanza una oleada de flechas que vuelan hacia el centro y se clavan
function wave(n,delay=0,big=1){
  const W=innerWidth, H=innerHeight, base=Math.max(.6,Math.min(W,H)/900), D=Math.hypot(W,H)*1.15, t=now();
  for(let i=0;i<n;i++){
    const ang=Math.random()*Math.PI*2;
    const a={ ang, tx:W/2+(Math.random()-.5)*W*.42, ty:H/2+(Math.random()-.5)*H*.5,
      w:(34+Math.random()*46)*base*big, len:D*1.6, D, t0:t+delay+i*.065+Math.random()*.03, dur:.15+Math.random()*.05, hit:false };
    arrows.push(a);
    if(actx) sfxThud(actx.currentTime+(a.t0-t)+a.dur, big);
  }
}
function fxLoop(){
  if(!fxRun) return;
  const t=now(), W=innerWidth, H=innerHeight;
  fctx.save(); fctx.clearRect(0,0,W,H);
  if(shake>.5){ fctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake); shake*=.86; }
  const z=1+(t-fxT0)*.05;                                    // zoom lento hacia adentro
  fctx.save(); fctx.translate(W/2,H/2); fctx.scale(z,z); fctx.drawImage(gridCv,-W/2,-H/2,W,H); fctx.restore();
  for(const a of arrows){
    const p=Math.min(1,(t-a.t0)/a.dur); if(p<=0) continue;
    const e=1-Math.pow(1-p,3), back=(1-e)*a.D;
    if(p>=1&&!a.hit){ a.hit=true; shake=Math.max(shake,12*Math.min(2,a.w/40)); }
    drawArrow(fctx,a,a.tx-Math.cos(a.ang)*back,a.ty-Math.sin(a.ang)*back);
  }
  fctx.restore();
  requestAnimationFrame(fxLoop);
}
function startFx(){ buildGrid(); arrows=[]; shake=0; fxT0=now(); fx.classList.add("on"); if(!fxRun){ fxRun=true; requestAnimationFrame(fxLoop); } }
function stopFx(){ fxRun=false; arrows=[]; fx.classList.remove("on"); fctx.clearRect(0,0,innerWidth,innerHeight); }
function sfxThud(at,big=1){ if(!actx) return;
  const t=Math.max(at,actx.currentTime);
  noise(Math.max(actx.currentTime,t-.12),.12,.12,sfxBus,"highpass",3000);            // "fiuu" de llegada
  const k=osc("sine",140,t,.18,.35*big,sfxBus); k.frequency.exponentialRampToValueAtTime(40,t+.15);
  noise(t,.12,.25,sfxBus,"lowpass",900);
}

/* ---- voz del anunciador ---- */
const voiceCache={};
async function loadVoice(key){
  if(!key||!ac()) return null;
  if(key in voiceCache) return voiceCache[key];
  try{
    const src=(window.VOICES&&VOICES[key])||key;
    const data=await (await fetch(src)).arrayBuffer();
    voiceCache[key]=await actx.decodeAudioData(data);
  }catch(e){ voiceCache[key]=null; }
  return voiceCache[key];
}
// devuelve la duración aproximada (s) de lo que se dice
async function sayName(key,fallbackText){
  if(!soundOn) return 1.2;
  const buf=await loadVoice(key);
  if(buf){
    const s=actx.createBufferSource(), g=actx.createGain(); g.gain.value=1.3;
    s.buffer=buf; s.connect(g).connect(master); s.start();
    musicLevel(MUS_VOL*.35,.05); setTimeout(()=>{ if(musicOn&&!launching) musicLevel(MUS_VOL,.3); },buf.duration*1000);
    return buf.duration;
  }
  if(window.speechSynthesis&&fallbackText){          // respaldo si no hay audio: voz del sistema, grave y lenta
    const u=new SpeechSynthesisUtterance(fallbackText); u.lang="en-US"; u.pitch=.1; u.rate=.8;
    speechSynthesis.cancel(); speechSynthesis.speak(u); return 1.8;
  }
  return 1.2;
}

/* --- pantalla PRESIONA START --- */
const [hA,...hB]=HUB.name.split(" "); $("#introA").textContent=hA.toUpperCase(); $("#introB").textContent=hB.join(" ").toUpperCase();
async function startHub(){
  if(started) return; started=true; ac();
  GAMES.forEach(g=>loadVoice(g.voice));                 // precarga de voces
  sfxStart(); flash(380); sayName(HUB.voice,HUB.name);
  startFx(); wave(isLite()?4:6,.08,.9);
  if(musicOn) startMusic();
  await wait(1000);
  flash(380); stopFx(); $("#intro").classList.add("out");
}
$("#intro").addEventListener("click",startHub);

/* --- lanzar juego: secuencia de selección --- */
async function launch(){
  const g=GAMES[sel]; if(!started||!g.url||launching) return;
  launching=true; const c=cards[sel];
  try{ sessionStorage.setItem("cq_back", location.href.split("#")[0]); }catch(e){}
  loadVoice(g.voice);
  sfxConfirm(); flash(260); c.classList.add("chosen");
  await wait(120);
  startFx(); wave(isLite()?6:9,0,1);
  await wait(700);
  wave(isLite()?3:5,0,1.45);
  await wait(320);
  flash(240,.9); slam.querySelector("b").textContent=g.name; slam.classList.add("on"); sfxSlam();
  const dur=await sayName(g.voice,g.name);
  await wait(Math.max(1100,(dur-1.1)*1000));
  flash(500); musicLevel(0,.2);
  $("#launchArt").innerHTML=coverSVG(g); $("#launchArt").classList.add("playing");
  $("#launchTxt").textContent="Cargando "+g.name+"…"; $("#launch").classList.add("on");
  setTimeout(()=>{ stopFx(); slam.classList.remove("on"); },250);
  await wait(550);
  location.href=g.url;
}
addEventListener("pageshow",()=>{ if(bgm&&musicOn&&started) bgm.play().catch(()=>{}); launching=false; $("#launch").classList.remove("on"); slam.classList.remove("on"); stopFx();
  cards.forEach(c=>c.classList.remove("chosen")); if(started&&musicOn&&actx) musicLevel(MUS_VOL,.3); });

/* --- controles --- */
$("#bPrev").onclick=()=>select(sel-1);
$("#bNext").onclick=()=>select(sel+1);
$("#bPlay").onclick=launch;
$("#bHome").onclick=()=>{offset=0;select(0)};
$("#bFull").onclick=toggleFull;
$("#bSound").onclick=toggleSound;
$("#bMusic").onclick=toggleMusic;
$("#bLite").onclick=()=>document.body.classList.toggle("lite");
function toggleFull(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{}); else document.exitFullscreen?.(); }

addEventListener("keydown",e=>{
  if(!started){ if(!["Shift","Control","Alt","Meta"].includes(e.key)){ e.preventDefault(); startHub(); } return; }
  ac();
  switch(e.key){
    case "ArrowRight": case "d": select(sel+1); break;
    case "ArrowLeft": case "a": select(sel-1); break;
    case "Enter": case " ": e.preventDefault(); launch(); break;
    case "f": case "F": toggleFull(); break;
    case "m": case "M": toggleMusic(); break;
    case "n": case "N": toggleSound(); break;
    case "l": case "L": document.body.classList.toggle("lite"); break;
    case "Home": offset=0; select(0); break;
  }
});
let wheelLock=0;
addEventListener("wheel",e=>{ if(!started) return; const n=Date.now(); if(n-wheelLock<180) return; wheelLock=n; select(sel+((e.deltaY||e.deltaX)>0?1:-1)); },{passive:true});
let tx=null;
addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});
addEventListener("touchend",e=>{ if(tx===null||!started) return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>50) select(sel+(dx<0?1:-1)); tx=null; });

/* --- gamepad (control de Xbox/genérico) --- */
let padPrev={};
function pollPad(){
  const p=[...(navigator.getGamepads?.()||[])].find(Boolean);
  if(p){
    const ax=p.axes[0]||0, st={
      l:p.buttons[14]?.pressed||ax<-.6, r:p.buttons[15]?.pressed||ax>.6,
      a:p.buttons[0]?.pressed||p.buttons[9]?.pressed };
    if(!started){ if(st.a&&!padPrev.a) startHub(); }
    else{
      if(st.l&&!padPrev.l) select(sel-1);
      if(st.r&&!padPrev.r) select(sel+1);
      if(st.a&&!padPrev.a) launch();
    }
    padPrev=st;
  }
  requestAnimationFrame(pollPad);
}
addEventListener("gamepadconnected",()=>requestAnimationFrame(pollPad),{once:true});

/* --- reloj --- */
function clock(){ $("#clock").textContent=new Date().toLocaleTimeString("es-CO",{hour:"numeric",minute:"2-digit"}); }
clock(); setInterval(clock,10000);

/* --- burbujas Aero --- */
(()=>{ const b=$("#bubbles"); for(let i=0;i<14;i++){ const s=document.createElement("span"); const z=8+Math.random()*34;
  s.style.cssText=`left:${Math.random()*100}%;width:${z}px;height:${z}px;animation-duration:${14+Math.random()*18}s;animation-delay:${-Math.random()*30}s;opacity:${.25+Math.random()*.4}`; b.appendChild(s);} })();

/* --- modo ligero automático en equipos modestos --- */
if((navigator.hardwareConcurrency||4)<=2 || (navigator.deviceMemory&&navigator.deviceMemory<=2)) document.body.classList.add("lite");

addEventListener("resize",()=>{ ensureVisible(sel); sizeFx(); });
select(0,true);

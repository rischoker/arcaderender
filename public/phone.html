<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2a1a0e">
<title>Castle Quest – Player</title>
<style>
:root{--wood:#2a1a0e;--wood2:#3d2716;--parch:#f6ead0;--parch2:#e9d6ac;--ink:#3a2410;--gold:#f2c14e;--gold2:#c8901c;--red:#c0392b;--green:#2e9e5b;--blue:#2f6fb0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at top,#4a2e18,#1b0f07 70%);color:var(--parch);font-family:Georgia,'Times New Roman',serif;overflow:hidden}
body{display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;padding:16px;gap:12px;overflow-y:auto;animation:fade .25s}
.screen.on{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:30px;margin:6px 0 0;text-align:center;color:var(--gold);text-shadow:0 2px 0 #000,0 0 18px #a8701a;letter-spacing:1px}
h2{margin:0;font-size:20px;color:var(--gold);text-align:center}
.sub{text-align:center;opacity:.8;font-size:14px;margin:0}
.card{background:linear-gradient(#fbf2dc,#ecdab2);color:var(--ink);border-radius:14px;padding:14px;box-shadow:0 4px 0 #8a6a3a,0 8px 18px #0008;border:2px solid #b8955a}
label{font-size:13px;font-weight:bold;letter-spacing:.5px;text-transform:uppercase;opacity:.75}
input{width:100%;font:inherit;font-size:22px;padding:12px;border-radius:10px;border:2px solid #b8955a;background:#fffaf0;color:var(--ink);margin-top:4px;outline:none}
input:focus{border-color:var(--gold2);box-shadow:0 0 0 3px #f2c14e66}
#code{text-transform:uppercase;letter-spacing:8px;text-align:center;font-weight:bold}
.btn{font:inherit;font-size:20px;font-weight:bold;padding:14px;border-radius:12px;border:none;cursor:pointer;color:#2a1a0e;background:linear-gradient(#ffd977,#e0a42c);box-shadow:0 4px 0 #8a5d10,0 6px 12px #0007;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5d10}
.btn:disabled{filter:grayscale(1);opacity:.6}
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.ch{border-radius:12px;border:3px solid transparent;background:#d9c391;padding:4px;text-align:center;font-size:12px;font-weight:bold;cursor:pointer;color:var(--ink)}
.ch img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:linear-gradient(#7fb2d9,#cfe6c6);display:block}
.ch.sel{border-color:var(--gold2);background:#ffe9a8;box-shadow:0 0 0 3px #f2c14e88}
.err{color:#ff8a7a;text-align:center;min-height:20px;font-size:15px}
/* question */
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.badge{background:#0006;border:1px solid #f2c14e66;color:var(--gold);padding:4px 10px;border-radius:20px;font-weight:bold}
.score{font-weight:bold;color:var(--gold)}
.timer{height:16px;background:#0008;border-radius:10px;overflow:hidden;position:relative;border:1px solid #f2c14e55}
.timer i{position:absolute;inset:0;transform-origin:left;background:linear-gradient(90deg,#e74c3c,#f39c12 30%,#2ecc71 60%)}
.walker{position:relative;height:28px;font-size:22px}
.walker span{position:absolute;top:0;transition:left .25s linear}
.prompt{font-size:21px;line-height:1.35}
.prompt .gap{display:inline-block;min-width:60px;border-bottom:3px solid var(--gold2)}
.prompt .notice{display:block;background:#fffaf0;border:2px dashed #b8955a;border-radius:8px;padding:10px;margin-bottom:8px;font-family:'Courier New',monospace;font-size:17px}
.opts{display:grid;gap:10px}
.opt{font:inherit;text-align:left;font-size:19px;padding:14px 14px 14px 52px;border-radius:12px;border:2px solid #b8955a;background:#fffaf0;color:var(--ink);position:relative;box-shadow:0 3px 0 #8a6a3a;cursor:pointer;min-height:56px}
.opt b{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:15px}
.opt:nth-child(1) b{background:#c0392b}.opt:nth-child(2) b{background:#2f6fb0}.opt:nth-child(3) b{background:#d39a12}.opt:nth-child(4) b{background:#2e9e5b}
.opt:active{transform:translateY(2px)}
.opt.picked{outline:4px solid var(--gold)}
.opt.right{background:#c9f2d5;border-color:var(--green)}
.opt.wrong{background:#f6c9c3;border-color:var(--red)}
body.golden{background:radial-gradient(ellipse at top,#7a5a10,#2a1a05 70%)}
body.golden .card{background:linear-gradient(#fff6d5,#f5dd8c);border-color:#d4a017;box-shadow:0 4px 0 #9c7410,0 0 30px #f2c14e88}
.goldtitle{text-align:center;font-size:24px;font-weight:bold;color:#ffe08a;text-shadow:0 0 12px #f2c14e,0 2px 0 #000;animation:shine 1.2s infinite alternate}
@keyframes shine{to{text-shadow:0 0 26px #ffd34e,0 2px 0 #000}}
/* result */
#result{justify-content:center;align-items:center;text-align:center}
.big{font-size:84px;line-height:1;animation:pop .4s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.restext{font-size:28px;font-weight:bold}
.pts{font-size:22px;color:var(--gold)}
.ans{font-size:22px;background:#fffaf0;color:var(--ink);padding:10px 14px;border-radius:10px;border:2px solid var(--green);margin-top:6px}
.ups{display:grid;gap:10px}
.up{display:flex;gap:12px;align-items:center;text-align:left;font:inherit;padding:12px;border-radius:12px;border:3px solid #d4a017;background:linear-gradient(#fff6d5,#f5dd8c);color:var(--ink);box-shadow:0 4px 0 #9c7410;cursor:pointer}
.up .ic{font-size:38px}.up .nm{font-weight:bold;font-size:19px}.up .ds{font-size:15px}
.rankcard{display:flex;gap:12px;align-items:center}.rankcard .ri{font-size:46px}.rankcard b{display:block;font-size:22px;color:#7a2a10}.rankcard small{font-size:13px;opacity:.85}
.fb .nums{display:flex;gap:14px;font-weight:bold;font-size:17px;margin:4px 0}.fb h4{margin:8px 0 2px;font-size:14px}.fb ul{margin:0;padding-left:18px;font-size:14px;line-height:1.35}
.final-rank{font-size:56px;text-align:center;color:var(--gold);font-weight:bold;text-shadow:0 3px 0 #000}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#0005;border:1px solid #f2c14e44;border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--gold)}
.parts .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #b8955a66;font-size:15px}
.bar{height:8px;background:#0002;border-radius:4px;overflow:hidden;width:80px;flex:none}.bar i{display:block;height:100%;background:var(--green)}
.lb .row{display:flex;gap:8px;padding:6px 2px;border-bottom:1px solid #b8955a44;font-size:16px}
.lb .row span:first-child{width:28px;font-weight:bold}.lb .row span:nth-child(2){flex:1}
.overlay{position:fixed;inset:0;background:#000c;display:none;place-items:center;z-index:9;text-align:center;font-size:26px;color:var(--gold)}
.overlay.on{display:grid}
.conn{position:fixed;top:6px;right:8px;width:10px;height:10px;border-radius:50%;background:#e74c3c;z-index:10}
.conn.ok{background:#2ecc71}
.me{display:flex;align-items:center;gap:12px}.me img{width:84px;height:84px;border-radius:12px;background:linear-gradient(#7fb2d9,#cfe6c6);border:3px solid var(--gold2)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:8}
</style>
</head>
<body>
<div class="conn" id="conn"></div>
<div class="flash" id="flash"></div>

<section class="screen on" id="join">
  <h1>🏰 Castle Quest</h1>
  <p class="sub">Defend the castle with your English!</p>
  <div class="card">
    <label>Room code</label><input id="code" maxlength="4" autocomplete="off" inputmode="text">
    <div style="height:10px"></div>
    <label>Your name</label><input id="name" maxlength="14" autocomplete="off" placeholder="Type your name">
    <div style="height:10px"></div>
    <label>Choose your hero</label>
    <div class="chars" id="chars"></div>
  </div>
  <div class="err" id="err"></div>
  <button class="btn" id="joinBtn">⚔️ Join the defense</button>
</section>

<section class="screen" id="lobby">
  <h1>You're in!</h1>
  <div class="card me"><img id="meImg" alt=""><div><div style="font-size:24px;font-weight:bold" id="meName"></div><div>Look at the big screen 👀</div></div></div>
  <p class="sub">Waiting for the teacher to start the battle…</p>
  <div class="card"><label>Change your hero</label><div class="chars" id="chars2"></div></div>
</section>

<section class="screen" id="question">
  <div class="qtop"><span class="badge" id="qPart"></span><span class="score">⭐ <span id="qScore">0</span></span></div>
  <div id="goldTitle" class="goldtitle" style="display:none">✨ GOLDEN QUESTION ✨<div style="font-size:14px">Type the answer · win an upgrade!</div></div>
  <div class="walker"><span id="walker">🧑‍🌾🛒</span><span style="right:0">🏰</span></div>
  <div class="timer"><i id="timerBar"></i></div>
  <div class="card prompt" id="qPrompt"></div>
  <div class="opts" id="qOpts"></div>
  <div id="qType" style="display:none">
    <input id="typeIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type here…">
    <div style="height:10px"></div>
    <button class="btn" style="width:100%" id="typeBtn">Send ✨</button>
  </div>
</section>

<section class="screen" id="result"></section>

<section class="screen" id="upgrade">
  <div class="goldtitle">🏆 Choose an upgrade!</div>
  <p class="sub">Your choice helps the whole castle</p>
  <div class="ups" id="ups"></div>
</section>

<section class="screen" id="final"></section>

<div class="overlay" id="pause"><div>⏸️<br>Paused</div></div>

<script>
const CHARS = [['Knight','Knight'],['Barbarian','Barbarian'],['Mage','Mage'],['Ranger','Ranger'],['Rogue','Rogue'],['Rogue_Hooded','Hooded Rogue']];
const $ = id => document.getElementById(id);
const store = { get(k){ try{return localStorage.getItem(k)}catch{return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch{} } };
const params = new URLSearchParams(location.search);
let ws, pid = null, code = (params.get('code') || store.get('cq_code') || '').toUpperCase(), myChar = store.get('cq_char') || 'Knight', myName = store.get('cq_name') || '';
let joined = false, cur = null, tick = null, total = 0, level = '', wantJoin = false;
$('code').value = code; $('name').value = myName;
let autoJoin = false;
if (store.get('cq_pid') && store.get('cq_code') === code && myName && code) { wantJoin = true; autoJoin = true; }
if (params.get('code')) $('name').focus();

function renderChars(el) {
  el.innerHTML = '';
  for (const [id, nm] of CHARS) {
    const d = document.createElement('div'); d.className = 'ch' + (id === myChar ? ' sel' : '');
    d.innerHTML = `<img src="/assets/portraits/${id}.png" alt=""><div>${nm}</div>`;
    d.onclick = () => { myChar = id; store.set('cq_char', id); renderChars($('chars')); renderChars($('chars2')); $('meImg').src = `/assets/portraits/${id}.png`; if (joined) sendMsg({ t: 'setChar', char: id }); };
    el.appendChild(d);
  }
}
renderChars($('chars')); renderChars($('chars2'));

function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch {} }
function flash(color) { const f = $('flash'); f.style.background = color; f.style.transition = 'none'; f.style.opacity = .55; requestAnimationFrame(() => { f.style.transition = 'opacity .6s'; f.style.opacity = 0; }); }
let actx; function beep(freqs, dur = .12, type = 'triangle', vol = .15) {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); let t = actx.currentTime;
    for (const f of freqs) { const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur); t += dur * .8; } } catch {}
}
let wakeLock; async function keepAwake() { try { wakeLock = await navigator.wakeLock.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); if (!ws || ws.readyState > 1) connect(); } });

function sendMsg(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }
let backoff = 500;
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => { $('conn').classList.add('ok'); backoff = 500; if (wantJoin) doJoin(); };
  ws.onclose = () => { $('conn').classList.remove('ok'); setTimeout(connect, backoff); backoff = Math.min(backoff * 1.6, 5000); };
  ws.onmessage = e => onMsg(JSON.parse(e.data));
}
setInterval(() => sendMsg({ t: 'ping' }), 20000);

function doJoin() {
  const savedPid = store.get('cq_pid'), savedCode = store.get('cq_code');
  sendMsg({ t: 'join', code, name: myName, char: myChar, pid: savedCode === code ? savedPid : null });
}
$('joinBtn').onclick = () => {
  code = $('code').value.toUpperCase().trim(); myName = $('name').value.trim();
  if (code.length !== 4) return $('err').textContent = 'The room code has 4 letters.';
  if (!myName) return $('err').textContent = 'Please type your name.';
  store.set('cq_name', myName); $('err').textContent = ''; wantJoin = true; keepAwake(); beep([523, 659]);
  if (ws && ws.readyState === 1) doJoin();
};
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') $('name').focus(); });
$('name').addEventListener('keydown', e => { if (e.key === 'Enter') $('joinBtn').click(); });

function onMsg(m) {
  if (m.t === 'error') { $('err').textContent = autoJoin ? '' : m.msg; autoJoin = false; wantJoin = false; show('join'); return; }
  if (m.t === 'kicked') { wantJoin = false; joined = false; store.set('cq_pid', ''); show('join'); $('err').textContent = 'You were removed from the room.'; return; }
  if (m.t === 'joined') {
    joined = true; pid = m.pid; store.set('cq_pid', pid); store.set('cq_code', code);
    myChar = m.char; $('meName').textContent = m.name; $('meImg').src = `/assets/portraits/${myChar}.png`; renderChars($('chars2'));
    if (m.state === 'lobby') show('lobby'); else if (m.state === 'playing') { level = m.level; waitScreen('Get ready! ⚔️'); }
    return;
  }
  if (m.t === 'start') { level = m.level; total = 0; vib([100, 60, 100]); beep([392, 523, 659, 784], .15); waitScreen('The battle begins! ⚔️'); return; }
  if (m.t === 'question') return showQuestion(m);
  if (m.t === 'result') return showResult(m);
  if (m.t === 'upgrade_ok') { waitScreen('Upgrade sent to the castle! 🏰'); return; }
  if (m.t === 'pause') { $('pause').classList.toggle('on', m.on); if (cur) cur.paused = m.on, cur.pauseAt = Date.now(); return; }
  if (m.t === 'buzz') { vib([200, 100, 200, 100, 300]); return; }
  if (m.t === 'final') return showFinal(m);
  if (m.t === 'lobby') { document.body.classList.remove('golden'); show('lobby'); return; }
}

function waitScreen(txt) {
  document.body.classList.remove('golden');
  $('result').innerHTML = `<div class="big">🏰</div><div class="restext">${txt}</div><p class="sub">Your next question is coming…</p>`; show('result');
}

function fmtPrompt(s) {
  const esc = t => t.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  let html = esc(s);
  // avisos tipo examen en su propio recuadro
  html = html.replace(/^(NOTICE|SIGN|Sign|MESSAGE|EMAIL|TEXT|LABEL):\s*"(.+?)"\s*(.*)$/, (_, k, body, rest) => `<span class="notice"><b>${k.toUpperCase()}</b><br>${body}</span>${rest || 'What does it say?'}`);
  return html.replace(/_{3,}/g, '<span class="gap">&nbsp;</span>');
}

function showQuestion(m) {
  cur = { ...m, start: Date.now(), answered: false }; clearInterval(tick);
  document.body.classList.toggle('golden', !!m.golden);
  $('qPart').textContent = `${m.level} · ${m.part}`; $('qScore').textContent = total;
  $('goldTitle').style.display = m.golden ? 'block' : 'none';
  $('qPrompt').innerHTML = fmtPrompt(m.prompt);
  const opts = $('qOpts'); opts.innerHTML = '';
  if (m.golden) {
    $('qType').style.display = 'block'; $('typeIn').value = ''; setTimeout(() => $('typeIn').focus(), 200);
    vib([80, 60, 80, 60, 250]); beep([784, 988, 1175, 1568], .12, 'sine', .12);
  } else {
    $('qType').style.display = 'none';
    m.options.forEach((o, i) => {
      const b = document.createElement('button'); b.className = 'opt'; b.innerHTML = `<b>${'ABCD'[i]}</b>`; b.appendChild(document.createTextNode(o));
      b.onclick = () => { if (cur.answered) return; cur.answered = true; b.classList.add('picked'); cur.picked = i; sendMsg({ t: 'answer', qid: m.qid, choice: i }); };
      opts.appendChild(b);
    });
    vib(120); beep([660, 880], .08, 'sine', .1);
  }
  show('question');
  let pausedMs = 0;
  tick = setInterval(() => {
    if (cur.paused) { pausedMs += 100; return; }
    const left = Math.max(0, 1 - (Date.now() - cur.start - pausedMs) / (m.time * 1000));
    $('timerBar').style.transform = `scaleX(${left})`;
    $('walker').style.left = `calc(${(1 - left) * 85}% )`;
    if (left < .25 && !cur.warned) { cur.warned = true; vib(60); }
  }, 100);
}
$('typeBtn').onclick = () => { if (!cur || cur.answered) return; const v = $('typeIn').value.trim(); if (!v) return; cur.answered = true; sendMsg({ t: 'answer', qid: cur.qid, text: v }); };
$('typeIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('typeBtn').click(); });

function showResult(m) {
  clearInterval(tick); total = m.total;
  const wasGolden = cur && cur.golden;
  if (cur && !wasGolden && cur.picked != null) {
    const btns = $('qOpts').children;
    for (const b of btns) if (b.textContent.slice(1) === m.answer) b.classList.add('right');
    if (!m.correct) btns[cur.picked].classList.add('wrong');
  }
  const r = $('result');
  if (m.correct) {
    vib(wasGolden ? [100, 50, 100, 50, 100, 50, 400] : [60, 40, 120]); flash('#2ecc71'); beep(wasGolden ? [523, 659, 784, 1047, 1319] : [659, 988], .11, 'triangle', .14);
    const streak = m.streak >= 3 ? `<div class="pts">🔥 Streak x${m.streak}</div>` : '';
    r.innerHTML = `<div class="big">${wasGolden ? '🏆' : '✅'}</div><div class="restext">${['Great!', 'Correct!', 'Well done!', 'Excellent!', 'Brilliant!'][Math.random() * 5 | 0]}</div><div class="pts">+${m.points} ⭐</div>${streak}<p class="sub">Your villager reached the castle! 🧑‍🌾🏰</p>`;
  } else {
    vib([300, 100, 300]); flash('#e74c3c'); beep([300, 200], .2, 'sawtooth', .08);
    r.innerHTML = `<div class="big shake">${m.timedOut ? '⌛' : '❌'}</div><div class="restext">${m.timedOut ? "Time's up!" : 'Not quite…'}</div><p class="sub">The correct answer is:</p><div class="ans">${m.answer.replace(/[<>]/g, '')}</div>${m.explain ? `<p class="sub">${m.explain}</p>` : ''}`;
  }
  // en preguntas normales dejamos ver un momento las opciones coloreadas
  if (!wasGolden && cur && cur.picked != null && !m.correct) { setTimeout(() => show('result'), 900); } else show('result');
  if (m.upgrades) setTimeout(() => showUpgrades(m.upgrades), 1300);
  cur = null;
}

function showUpgrades(list) {
  const U = (window.UPGRADES && UPGRADES.list) || {};
  const box = $('ups'); box.innerHTML = '';
  for (const id of list) {
    const u = U[id] || { icon: '✨', name: id, desc: '' };
    const b = document.createElement('button'); b.className = 'up';
    b.innerHTML = `<span class="ic">${u.icon}</span><span><div class="nm">${u.name}</div><div class="ds">${u.desc}</div></span>`;
    b.onclick = () => { sendMsg({ t: 'pick', id }); beep([880, 1320], .1); box.querySelectorAll('button').forEach(x => x.disabled = true); };
    box.appendChild(b);
  }
  show('upgrade');
}

function showFinal(m) {
  clearInterval(tick); document.body.classList.remove('golden');
  const r = m.report, medal = r.rank === 1 ? '🥇' : r.rank === 2 ? '🥈' : r.rank === 3 ? '🥉' : '#' + r.rank;
  const f = r.feedback || FEEDBACK.build(r);
  const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const li = (h, a) => a && a.length ? `<h4>${h}</h4><ul>${a.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
  const parts = (r.parts || []).map(p => `<div class="row"><span>${p.name}</span><span style="display:flex;gap:8px;align-items:center">${p.ok}/${p.n}<span class="bar"><i style="width:${p.n ? p.ok / p.n * 100 : 0}%"></i></span></span></div>`).join('');
  $('final').innerHTML = `
    <h1>${m.win === false ? '💔 The castle fell…' : m.win ? '👑 Victory!' : '📜 Results'}</h1>
    ${m.team ? `<p style="text-align:center;margin:0">Team accuracy <b style="color:${m.team.accuracy >= m.team.pass ? '#7dff8a' : '#ff7a6a'}">${m.team.accuracy}%</b> · ${m.team.pass}% needed</p>` : ''}
    <div class="card rankcard"><div class="ri">${f.rank.icon}</div><div><b>${f.rank.title}</b><small>${f.rank.line}</small></div></div>
    <div class="final-rank">${medal}<div style="font-size:16px;color:var(--parch)">of ${m.players} defenders</div></div>
    <div class="stats">
      <div class="stat"><b>${r.points}</b>points</div><div class="stat"><b>${r.accuracy}%</b>accuracy</div>
      <div class="stat"><b>${r.correct}/${r.total}</b>correct</div><div class="stat"><b>🔥 ${r.best}</b>best streak</div>
      <div class="stat"><b>✨ ${r.goldenOk}/${r.golden}</b>golden</div><div class="stat"><b>${r.avgTime ?? '–'}s</b>avg. time</div>
    </div>
    <div class="card fb"><label>Your feedback</label>
      <div class="nums"><span style="color:#2a8a3a">✓ ${r.correct} correct</span><span style="color:#b8301e">✗ ${r.wrong ?? 0} wrong</span>${r.timeout ? `<span>⌛ ${r.timeout} late</span>` : ''}</div>
      ${li('💪 Strengths', f.strengths)}${li('🎯 Needs work', f.weaknesses)}${li('📖 How to improve', f.tips)}</div>
    <div class="card parts"><label>Your exam report · ${r.level}</label>${parts || '<p>No answers yet.</p>'}</div>
    <button class="btn" id="submitBtn">🌍 Send my score to the world ranking (optional)</button>
    <div class="err" id="subMsg"></div>
    <div class="card lb" id="lb"><label>🌍 World top 10 · ${r.level}</label><div id="lbRows">Loading…</div></div>`;
  show('final');
  vib(m.win ? [100, 50, 100, 50, 500] : [500]);
  $('submitBtn').onclick = async () => {
    $('submitBtn').disabled = true;
    try {
      const res = await fetch('/api/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code, pid }) }).then(x => x.json());
      $('subMsg').style.color = res.ok ? '#8f8' : '#f88'; $('subMsg').textContent = res.ok ? 'Saved! 🎉' : (res.msg || 'Error');
      loadTop(r.level);
    } catch { $('subMsg').textContent = 'Connection error'; $('submitBtn').disabled = false; }
  };
  loadTop(r.level);
}
async function loadTop(lv) {
  try {
    const rows = await fetch('/api/top?level=' + lv).then(r => r.json());
    $('lbRows').innerHTML = rows.length ? rows.map((s, i) => `<div class="row"><span>${i + 1}</span><span>${String(s.name).replace(/[<>]/g, '')}</span><span>${s.points}</span></div>`).join('') : '<p>No scores yet. Be the first!</p>';
  } catch { $('lbRows').textContent = '—'; }
}
connect();
</script>
<script src="/shared/upgrades.js"></script>
<script src="/shared/feedback.js"></script>
</body>
</html>
